name: Integration Tests v2

on:
  workflow_dispatch:
  push:
    branches:
      - master-new-test-framework-milanka

jobs:
  db-integration-tests:
    runs-on: ubuntu-latest

    services:
      apim_db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: WSO2AM_APIMGT_DB
          MYSQL_USER: apim_user
          MYSQL_PASSWORD: apimpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      shared_db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: WSO2AM_COMMON_DB
          MYSQL_USER: shared_user
          MYSQL_PASSWORD: sharedpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: master-new-test-framework-milanka

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: 11.0.16+8
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client python3 python3-pip
          pip3 install gdown

      - name: Wait for DBs to be ready
        run: |
          echo "Waiting for databases..."
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpass --silent 2>/dev/null; then
              echo "apim_db is ready"
              break
            fi
            echo "Waiting for apim_db... ($i/60)"
            sleep 2
          done
          
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -prootpass --silent 2>/dev/null; then
              echo "shared_db is ready"
              break
            fi
            echo "Waiting for shared_db... ($i/60)"
            sleep 2
          done

      - name: Download and restore APIM DB dump
        run: |
          mkdir -p dumps
          APIM_URL="https://drive.google.com/file/d/1cukuKLcQwkuCDhEACqrmkSen7Dea2SCx/view?usp=sharing"
          echo "Downloading APIM DB dump from Google Drive..."
          gdown --fuzzy "${APIM_URL}" -O dumps/apim_db_dump.sql

          APIM_DB_CONTAINER=$(docker ps --filter "ancestor=mysql:8.0" --filter "publish=3306" --format "{{.ID}}" | head -n 1)
          echo "APIM DB container: ${APIM_DB_CONTAINER}"
          docker cp dumps/apim_db_dump.sql ${APIM_DB_CONTAINER}:/apim_db_dump.sql
          docker exec -i ${APIM_DB_CONTAINER} sh -c 'mysql -uapim_user -papimpass WSO2AM_APIMGT_DB < /apim_db_dump.sql'

      - name: Download and restore Shared DB dump
        run: |
          mkdir -p dumps
          SHARED_URL="https://drive.google.com/file/d/1UeR2rcnjEpaLkvjCjC39Tb35bZXUjMKT/view?usp=sharing"
          echo "Downloading Shared DB dump from Google Drive..."
          gdown --fuzzy "${SHARED_URL}" -O dumps/shared_db_dump.sql

          SHARED_DB_CONTAINER=$(docker ps --filter "ancestor=mysql:8.0" --filter "publish=3307" --format "{{.ID}}" | head -n 1)
          echo "Shared DB container: ${SHARED_DB_CONTAINER}"
          docker cp dumps/shared_db_dump.sql ${SHARED_DB_CONTAINER}:/shared_db_dump.sql
          docker exec -i ${SHARED_DB_CONTAINER} sh -c 'mysql -ushared_user -psharedpass WSO2AM_COMMON_DB < /shared_db_dump.sql'

      - name: Build APIM Product (Skip Tests)
        run: |
          echo "Building APIM product distribution (skipping tests)..."
          mvn clean install -Dmaven.test.skip=true -DskipTests \
            --file all-in-one-apim/pom.xml
          
          # Verify the distribution zip was created
          DIST_FILE=$(find all-in-one-apim/modules/distribution/product/target -name "wso2am-*.zip" | head -n 1)
          if [ -z "$DIST_FILE" ]; then
            echo "Error: Distribution zip file not found!"
            exit 1
          fi
          echo "✓ Distribution file created: $DIST_FILE"
          ls -lh "$DIST_FILE"

      - name: Run Integration Tests with MySQL
        run: |
          mvn clean install \
            --file all-in-one-apim/modules/integration-v2/pom.xml \
            -Pmigration \
            -DskipBenchMarkTest=true \
            -DskipRestartTests=true
        env:
          # API Manager Database (apim_db)
          API_MANAGER_DATABASE_TYPE: mysql
          API_MANAGER_DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
          API_MANAGER_DATABASE_URL: jdbc:mysql://host.docker.internal:3306/WSO2AM_APIMGT_DB?allowPublicKeyRetrieval=true&useSSL=false
          API_MANAGER_DATABASE_USERNAME: apim_user
          API_MANAGER_DATABASE_PASSWORD: apimpass
          API_MANAGER_DATABASE_VALIDATION_QUERY: SELECT 1

          # Shared Database (shared_db)
          SHARED_DATABASE_TYPE: mysql
          SHARED_DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
          SHARED_DATABASE_URL: jdbc:mysql://host.docker.internal:3307/WSO2AM_COMMON_DB?allowPublicKeyRetrieval=true&useSSL=false
          SHARED_DATABASE_USERNAME: shared_user
          SHARED_DATABASE_PASSWORD: sharedpass
          SHARED_DATABASE_VALIDATION_QUERY: SELECT 1

          # Test configuration
          GATEWAY_ENVIRONMENT: Production and Sandbox
          APIM_TEST_CONTAINERS_PARALLEL_ENABLED: False
          PARALLEL_THREAD_COUNT: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            all-in-one-apim/modules/integration-v2/tests-integration/**/target/surefire-reports/**
          if-no-files-found: warn